<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Infinity Turnkey Interiors — Dubai, Since 2013</title>
<link rel="icon" href="assets/infinity-logo-transparent.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,200..800;1,9..144,200..800&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<script src="https://cdn.tailwindcss.com"></script>

<!-- GSAP + ScrollTrigger + SplitText -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<!-- Lenis -->
<script src="https://unpkg.com/lenis@1.1.14/dist/lenis.min.js"></script>

<!-- React + Framer Motion + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/framer-motion@6.5.1/dist/framer-motion.js"></script>
<script>
  // framer-motion 6 UMD attaches as window.Motion; earlier .jsx files read window.FramerMotion
  window.FramerMotion = window.FramerMotion || window.Motion || window.framerMotion;
  if (!window.FramerMotion) {
    console.warn('FramerMotion UMD not found on window; check script tag.');
  }
</script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<link rel="stylesheet" href="styles.css" />

<script>
  // Register GSAP plugins once libraries load
  window.addEventListener('load', () => {
    if (window.gsap && window.ScrollTrigger) {
      window.gsap.registerPlugin(window.ScrollTrigger);
    }
  });
  // Also register immediately if already loaded
  if (window.gsap && window.ScrollTrigger) {
    window.gsap.registerPlugin(window.ScrollTrigger);
  }
</script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react" src="primitives.jsx"></script>
<script type="text/babel" data-presets="react" src="images.jsx"></script>
<script type="text/babel" data-presets="react" src="chrome.jsx"></script>
<script type="text/babel" data-presets="react" src="home.jsx"></script>
<script type="text/babel" data-presets="react" src="pages-1.jsx"></script>
<script type="text/babel" data-presets="react" src="pages-2.jsx"></script>
<script type="text/babel" data-presets="react" src="app.jsx"></script>

</body>
</html>
